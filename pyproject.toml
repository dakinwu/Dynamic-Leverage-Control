[build-system]
requires = ["setuptools>=77"]  # PEP 639 license metadata
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-leverage-control"
version = "0.1.0"
description = "Auditable Taiwan dynamic-exposure monitoring and paper-trading platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.121,<1",  # 0.121.0 added Depends(scope="function")
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
research = ["openpyxl>=3.1,<4"]
broker = ["shioaji>=1.2,<2"]
dev = [
  "openpyxl>=3.1,<4",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.23,<2",
  "pytest-cov>=6,<8",
  "respx>=0.22,<1",
  "ruff==0.17.4",
]

[project.scripts]
dvl = "dynamic_leverage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dynamic_leverage = ["reference/*.json", "reference/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
