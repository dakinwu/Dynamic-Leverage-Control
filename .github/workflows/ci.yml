name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,research]"
      - run: python -m ruff check src tests scripts migrations
      - run: python -m ruff format --check src tests migrations
      - run: python -m pytest

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    name: PostgreSQL migrations and API tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: dynamic_leverage
          POSTGRES_USER: dynamic
          POSTGRES_PASSWORD: dynamic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dynamic -d dynamic_leverage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://dynamic:dynamic-ci-only@localhost:5432/dynamic_leverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,research]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Models match migrations
        run: alembic check
      - name: API tests against PostgreSQL
        env:
          DVL_TEST_POSTGRES_URL: ${{ env.DATABASE_URL }}
        run: python -m pytest tests/integration

  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
